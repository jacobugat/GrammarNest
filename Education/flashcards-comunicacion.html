<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flashcards · Perspectivas sobre la comunicación</title>
  <style>
    :root { --bg:#0b1020; --panel:#141b31; --panel2:#1a2440; --ink:#f2f5ff; --muted:#aab6d4; --violet:#9a8cff; --cyan:#55d7e7; --line:rgba(255,255,255,.1); }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; color:var(--ink); font:16px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background:radial-gradient(circle at 10% 0%,#263363 0,transparent 30rem),radial-gradient(circle at 100% 100%,#173d54 0,transparent 32rem),var(--bg); }
    .wrap { width:min(1120px,calc(100% - 36px)); margin:auto; padding:52px 0 70px; }
    header { display:flex; justify-content:space-between; gap:24px; align-items:flex-end; margin-bottom:28px; } .eyebrow { color:var(--cyan); font-size:.76rem; letter-spacing:.14em; font-weight:800; text-transform:uppercase; } h1 { font-size:clamp(2rem,5vw,3.6rem); line-height:1.05; letter-spacing:-.05em; margin:8px 0 10px; max-width:800px; } .intro { color:var(--muted); max-width:710px; margin:0; }
    .counter { white-space:nowrap; padding:9px 14px; border:1px solid var(--line); color:var(--muted); border-radius:99px; background:#10172bd9; font-size:.9rem; }
    .controls { display:flex; gap:10px; flex-wrap:wrap; margin:25px 0 28px; } button { cursor:pointer; border:1px solid var(--line); background:#111932; color:var(--ink); border-radius:10px; padding:9px 13px; font:inherit; transition:.2s; } button:hover,button.active { border-color:var(--violet); background:#28234b; } button:focus-visible { outline:3px solid var(--cyan); outline-offset:2px; }
    .deck { display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:18px; } .card { height:360px; perspective:1100px; cursor:pointer; } .card-inner { height:100%; position:relative; transition:transform .65s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; } .card.is-flipped .card-inner { transform:rotateY(180deg); } .face { position:absolute; inset:0; overflow:auto; padding:25px; border:1px solid var(--line); border-radius:18px; backface-visibility:hidden; background:linear-gradient(145deg,#1b2545,#121a32); box-shadow:0 16px 40px #0003; } .back { transform:rotateY(180deg); background:linear-gradient(145deg,#192a47,#142139); }
    .tag { display:inline-block; color:#d8d3ff; background:#39325f; padding:3px 9px; border-radius:99px; font-size:.72rem; font-weight:750; letter-spacing:.05em; text-transform:uppercase; } .term { font-size:1.7rem; line-height:1.13; letter-spacing:-.03em; margin:18px 0 6px; } .english { color:var(--cyan); font-weight:650; font-size:.96rem; } .hint { color:var(--muted); font-size:.86rem; margin-top:78px; } .back h3 { font-size:.92rem; color:var(--cyan); text-transform:uppercase; letter-spacing:.08em; margin:0 0 5px; } .back p { margin:0 0 15px; } .back .en { color:#d2dbf4; font-size:.91rem; border-top:1px solid var(--line); padding-top:13px; } .example { background:#07132366; border-left:3px solid var(--violet); padding:10px 12px; border-radius:0 8px 8px 0; font-size:.91rem; }
    footer { color:var(--muted); font-size:.86rem; padding-top:30px; } @media(max-width:640px){ .wrap{padding-top:32px} header{align-items:flex-start;flex-direction:column}.card{height:390px}.hint{margin-top:48px} }
  </style>
</head>
<body>
  <main class="wrap">
    <header><div><div class="eyebrow">Competencias comunicativas · Bilingüe</div><h1>Perspectivas sobre la comunicación</h1><p class="intro">Haz clic en una tarjeta para descubrir la explicación y un ejemplo en español e inglés.</p></div><div class="counter" id="counter"></div></header>
    <nav class="controls" aria-label="Filtrar conceptos"><button class="active" data-filter="Todos">Todos</button><button data-filter="Fundamentos">Fundamentos</button><button data-filter="Pragmática">Pragmática</button><button data-filter="Asertividad">Asertividad</button><button data-filter="Satir y educación">Satir y educación</button></nav>
    <section class="deck" id="deck" aria-live="polite"></section>
    <footer>Basado en «Perspectivas sobre la comunicación» de María Luisa Naranjo Pereira (2005), a partir del análisis de Jhon Sandoval.</footer>
  </main>
  <script>
  const cards = [
    ['Fundamentos','Comunicación','Communication','Proceso de interrelación humana mediante el cual construimos vínculos y compartimos significados.','A human process of relating through which we build connections and share meanings.','Una estudiante aclara una duda con su profesor y ambos ajustan su comprensión.','A student clarifies a doubt with her teacher and both adjust their understanding.'],
    ['Fundamentos','Enfoque humanista','Humanistic approach','Perspectiva que sitúa a la persona en el centro: comunicar sirve, sobre todo, para desarrollar relaciones.','A perspective that places the person at the center: communication primarily develops relationships.','Escuchar cómo se siente un amigo antes de ofrecerle una solución.','Listening to how a friend feels before offering a solution.'],
    ['Fundamentos','Contexto cultural','Cultural context','Conjunto de creencias, valores y expectativas de la cultura que influye en el sentido del mensaje.','The beliefs, values, and expectations of a culture that shape a message’s meaning.','El saludo formal que se espera en una entrevista puede variar entre países.','The formal greeting expected in an interview can vary across countries.'],
    ['Fundamentos','Contexto situacional','Situational context','Condiciones concretas como el tiempo, la edad, el lugar o el momento en que ocurre el intercambio.','Concrete conditions such as time, age, place, or moment in which an exchange occurs.','No se habla igual con un compañero en el recreo que durante una exposición.','You do not speak to a classmate the same way at recess as during a presentation.'],
    ['Fundamentos','Contexto de urgencia','Urgency context','Necesidades, tensiones o presiones internas presentes cuando una persona se comunica.','The needs, tensions, or inner pressures present when a person communicates.','Al pedir ayuda por una emergencia, el tono suele ser más directo y breve.','When asking for help in an emergency, the tone is usually more direct and brief.'],
    ['Pragmática','Teoría pragmática','Pragmatic theory','Estudia la comunicación como conducta: transmitir información también produce efectos en otras personas.','It studies communication as behavior: transmitting information also affects other people.','Decir “llegaste tarde” informa un hecho, pero también puede expresar molestia.','Saying “you arrived late” states a fact but can also express annoyance.'],
    ['Pragmática','No es posible no comunicarse','One cannot not communicate','Incluso el silencio, la inmovilidad o evitar la mirada comunican algo a los demás.','Even silence, stillness, or avoiding eye contact communicates something to others.','Un alumno que no responde y mira al suelo puede comunicar incomodidad.','A student who does not answer and looks down may communicate discomfort.'],
    ['Pragmática','Contenido y relación','Content and relationship','Todo mensaje incluye lo que se dice y la relación que se establece al decirlo; el tono modifica el significado.','Every message includes what is said and the relationship established while saying it; tone changes meaning.','“Cierra la puerta” puede sonar como una petición o una orden, según el tono.','“Close the door” can sound like a request or an order, depending on the tone.'],
    ['Pragmática','Metacomunicación','Metacommunication','Comunicación acerca de la propia comunicación: permite aclarar cómo se está interpretando un mensaje.','Communication about communication itself; it helps clarify how a message is being interpreted.','“No quise sonar grosero; ¿podemos hablar de cómo lo entendiste?”','“I did not mean to sound rude; can we talk about how you understood it?”'],
    ['Pragmática','Puntuación de secuencias','Punctuation of sequences','Forma en que cada participante organiza mentalmente el inicio y la causa de una interacción.','How each participant mentally organizes the beginning and cause of an interaction.','Una pareja discute: uno se aleja porque lo critican y el otro critica porque se aleja.','A couple argues: one withdraws because of criticism, while the other criticizes because of the withdrawal.'],
    ['Asertividad','Asertividad','Assertiveness','Capacidad de expresar opiniones, derechos y necesidades con confianza, respeto y claridad.','The ability to express opinions, rights, and needs with confidence, respect, and clarity.','“No puedo entregar el trabajo hoy, pero lo enviaré mañana a primera hora.”','“I cannot submit the assignment today, but I will send it tomorrow morning.”'],
    ['Asertividad','Agresividad','Aggressiveness','Forma de expresión que impone o hiere; no equivale a ser asertivo y puede ocultar inseguridad.','A form of expression that imposes or hurts; it is not the same as assertiveness and may hide insecurity.','“Siempre arruinas todo; cállate” ataca a la persona en vez de plantear el problema.','“You always ruin everything; shut up” attacks the person instead of raising the problem.'],
    ['Asertividad','Manipulación','Manipulation','Intento indirecto de influir en otra persona para conseguir algo, evitando pedirlo de manera clara.','An indirect attempt to influence another person to obtain something while avoiding a clear request.','“Si de verdad me apreciaras, harías mi tarea” busca generar culpa.','“If you really cared about me, you would do my homework” seeks to create guilt.'],
    ['Asertividad','Desvalimiento','Helplessness','Forma de manipulación en la que alguien se presenta como incapaz para obtener atención o ayuda frecuente.','A form of manipulation in which someone presents themselves as incapable to obtain frequent attention or help.','“Yo no puedo hacerlo nunca; hazlo tú por mí” sustituye una petición directa.','“I can never do it; do it for me” replaces a direct request.'],
    ['Satir y educación','Comunicación funcional','Functional communication','Comunicación que verifica, pregunta y aclara en vez de asumir lo que el otro piensa o siente.','Communication that checks, asks, and clarifies rather than assuming what the other thinks or feels.','“¿Entendí bien que prefieres trabajar solo esta vez?”','“Did I understand correctly that you prefer to work alone this time?”'],
    ['Satir y educación','Comunicación disfuncional','Dysfunctional communication','Comunicación basada en suposiciones, mensajes confusos o patrones que dificultan el entendimiento.','Communication based on assumptions, confusing messages, or patterns that hinder understanding.','“Sé que estás molesto conmigo” sin preguntar ni confirmar la percepción.','“I know you are upset with me” without asking or confirming the perception.'],
    ['Satir y educación','Modelo acusador','Blaming model','Patrón que responsabiliza a otra persona por todo, especialmente cuando la autoestima se siente amenazada.','A pattern that holds another person responsible for everything, especially when self-esteem feels threatened.','“Si no fuera por ti, todo saldría bien” desplaza toda la culpa.','“If it were not for you, everything would be fine” shifts all blame.'],
    ['Satir y educación','Respuesta abierta','Congruent / open response','Respuesta en la que palabras, tono, gestos y sentimientos son coherentes y van en la misma dirección.','A response in which words, tone, gestures, and feelings are consistent and point in the same direction.','“Me preocupa el plazo; propongo que repartamos las tareas” dicho con tono calmado.','“I am concerned about the deadline; I suggest we divide the tasks” said calmly.'],
    ['Satir y educación','Comunicación no verbal','Nonverbal communication','Mensajes transmitidos por gestos, postura, mirada, distancia y tono; son difíciles de ocultar.','Messages conveyed through gestures, posture, gaze, distance, and tone; they are difficult to hide.','Decir “estoy bien” con lágrimas y voz temblorosa comunica algo distinto.','Saying “I am fine” with tears and a trembling voice communicates something different.'],
    ['Satir y educación','Escucha empática','Empathic listening','Escuchar intentando comprender la experiencia y los sentimientos de la otra persona desde su perspectiva.','Listening while trying to understand another person’s experience and feelings from their perspective.','El docente dice: “Parece que te frustró el ejercicio; veamos dónde se complicó”.','The teacher says: “It seems the exercise frustrated you; let’s see where it became difficult.”'],
    ['Fundamentos','Interrelación humana','Human interrelation','Dimensión de la comunicación que une a las personas y permite crear vínculos significativos, más allá de enviar datos.','The dimension of communication that connects people and enables meaningful bonds beyond sending data.','Dos compañeros conversan sobre sus dificultades y fortalecen su confianza mutua.','Two classmates talk about their difficulties and strengthen mutual trust.'],
    ['Fundamentos','Intercambio de información','Information exchange','Transmisión de datos entre personas; es una parte de comunicar, pero no agota su dimensión relacional.','The transmission of data between people; it is part of communicating but does not exhaust its relational dimension.','Enviar la hora de una reunión informa, pero saludar cordialmente también cuida la relación.','Sending a meeting time informs, but greeting warmly also cares for the relationship.'],
    ['Fundamentos','Creencias','Beliefs','Ideas que una persona o cultura considera verdaderas y que orientan cómo interpreta y expresa mensajes.','Ideas that a person or culture considers true and that guide how messages are interpreted and expressed.','Creer que mirar a los ojos demuestra respeto cambia la manera de escuchar.','Believing that eye contact shows respect changes how one listens.'],
    ['Fundamentos','Expectativas sociales','Social expectations','Suposiciones culturales sobre la conducta adecuada en una interacción.','Cultural assumptions about appropriate behavior in an interaction.','En una clase, se espera pedir la palabra antes de intervenir.','In a class, one is expected to ask for the floor before speaking.'],
    ['Fundamentos','Espacio físico','Physical space','Lugar y distancia corporal que influyen en cómo se percibe un intercambio comunicativo.','The place and physical distance that influence how a communicative exchange is perceived.','Una conversación privada en un pasillo lleno puede sentirse incómoda.','A private conversation in a crowded hallway can feel uncomfortable.'],
    ['Fundamentos','Presión interna','Internal pressure','Tensión o necesidad personal que condiciona lo que se dice, el tono y la urgencia de comunicar.','Personal tension or need that shapes what is said, the tone, and the urgency of communicating.','Quien teme perder una oportunidad puede hablar con ansiedad durante una entrevista.','Someone afraid of losing an opportunity may speak anxiously during an interview.'],
    ['Pragmática','Efecto del mensaje','Effect of a message','Impacto que un mensaje produce en quien lo recibe; comunicar no solo informa, también afecta.','The impact a message has on its receiver; communication not only informs, it also affects.','Un comentario de apoyo puede aumentar la seguridad de una compañera antes de exponer.','A supportive comment can increase a classmate’s confidence before presenting.'],
    ['Pragmática','Comunicación como conducta','Communication as behavior','Idea pragmática según la cual cada comportamiento observable puede tener valor comunicativo en una interacción.','A pragmatic idea according to which observable behavior can have communicative value in an interaction.','Cruzar los brazos durante una discusión puede ser interpretado como distancia o defensa.','Crossing one’s arms during an argument can be interpreted as distance or defensiveness.'],
    ['Pragmática','Silencio','Silence','Ausencia de palabras que, dentro de un contexto, puede expresar acuerdo, rechazo, cansancio o incomodidad.','An absence of words that, within a context, can express agreement, rejection, tiredness, or discomfort.','Tras una pregunta difícil, el silencio de un estudiante puede indicar que necesita pensar.','After a difficult question, a student’s silence may indicate a need to think.'],
    ['Pragmática','Inactividad','Inactivity','No realizar una acción esperada también puede constituir un mensaje para los demás.','Not performing an expected action can also constitute a message to others.','No abrir los mensajes de un grupo puede comunicar distancia o falta de disponibilidad.','Not opening a group’s messages can communicate distance or unavailability.'],
    ['Pragmática','Mensaje implícito','Implicit message','Sentido que no se dice literalmente, pero que se infiere de la conducta, el contexto o el tono.','Meaning that is not said literally but is inferred from behavior, context, or tone.','Decir “haz lo que quieras” con enojo puede implicar desacuerdo.','Saying “do whatever you want” angrily may imply disagreement.'],
    ['Pragmática','Síntoma como mensaje','Symptom as a message','Estrategia mencionada en el texto: alegar un malestar puede comunicar indirectamente el deseo de no interactuar.','A strategy mentioned in the text: claiming discomfort can indirectly communicate a wish not to interact.','“Hoy me duele mucho la cabeza” puede funcionar como una forma de evitar una conversación.','“My head hurts a lot today” can function as a way to avoid a conversation.'],
    ['Pragmática','El “qué” del mensaje','The “what” of a message','Contenido literal o información explícita que se transmite en una comunicación.','The literal content or explicit information conveyed in a communication.','En “necesito el informe hoy”, el contenido es la solicitud y el plazo.','In “I need the report today,” the content is the request and deadline.'],
    ['Pragmática','El “cómo” del mensaje','The “how” of a message','Modo relacional en que se emite un contenido: tono, actitud y señales que indican cómo debe entenderse.','The relational manner in which content is delivered: tone, attitude, and signals indicating how it should be understood.','La misma petición, dicha con una sonrisa o con ironía, se interpreta de forma diferente.','The same request, said with a smile or sarcasm, is interpreted differently.'],
    ['Pragmática','Conflicto circular','Circular conflict','Conflicto que se mantiene porque cada persona interpreta la conducta de la otra como la causa de su propia reacción.','A conflict that persists because each person interprets the other’s behavior as the cause of their own reaction.','“No hablo porque gritas” y “grito porque no hablas” forman un ciclo.','“I do not talk because you yell” and “I yell because you do not talk” form a cycle.'],
    ['Asertividad','Petición directa','Direct request','Forma clara y respetuosa de expresar una necesidad, alternativa a la manipulación.','A clear and respectful way to express a need, as an alternative to manipulation.','“¿Podrías explicarme este punto después de clase?”','“Could you explain this point to me after class?”'],
    ['Asertividad','Confianza personal','Self-confidence','Confianza en la propia persona, opiniones y derechos; es un componente central de la asertividad.','Confidence in oneself, one’s opinions, and one’s rights; it is a central component of assertiveness.','Una estudiante expresa una opinión distinta sin disculparse por tenerla.','A student expresses a different opinion without apologizing for having it.'],
    ['Satir y educación','Aclaración del mensaje','Message clarification','Acción de pedir precisión a quien emite un mensaje para evitar interpretar desde supuestos.','The act of asking a sender for precision to avoid interpreting from assumptions.','“Cuando dices que el trabajo está incompleto, ¿qué parte debo corregir?”','“When you say the work is incomplete, which part should I correct?”'],
    ['Satir y educación','Autoestima amenazada','Threatened self-esteem','Situación en la que una persona se siente vulnerable en su valoración personal y puede recurrir a patrones disfuncionales.','A situation in which a person feels vulnerable in their self-worth and may resort to dysfunctional patterns.','Ante una crítica, alguien culpa al equipo para no reconocer su error.','After criticism, someone blames the team to avoid acknowledging their mistake.'],
    ['Satir y educación','Signos no verbales','Nonverbal cues','Indicadores como gestos, mirada, postura y voz que revelan lo que una persona siente y comunica.','Indicators such as gestures, gaze, posture, and voice that reveal what a person feels and communicates.','Un “sí” dicho con voz baja y hombros caídos puede transmitir duda.','A “yes” spoken softly with slumped shoulders can convey doubt.'],
    ['Satir y educación','Comunicación educativa','Educational communication','Uso de la comunicación en la relación docente-estudiante para acompañar, comprender y facilitar el aprendizaje.','The use of communication in the teacher-student relationship to support, understand, and facilitate learning.','En vez de regañar, el profesor pregunta qué obstáculo tuvo el alumno y acuerdan un plan.','Instead of scolding, the teacher asks what obstacle the student faced and they agree on a plan.'],
    ['Satir y educación','Enmascarar sentimientos','Masking feelings','Uso de palabras que intentan ocultar lo que se siente, aunque las señales no verbales pueden revelar la emoción.','Using words to try to hide one’s feelings, even though nonverbal signs may reveal the emotion.','“No me importa” mientras se evita la mirada y tiembla la voz puede enmascarar tristeza.','“I do not care” while avoiding eye contact and speaking with a trembling voice may mask sadness.']
  ];
  const deck=document.querySelector('#deck'), counter=document.querySelector('#counter'); let current='Todos';
  function render(){ const list=cards.filter(c=>current==='Todos'||c[0]===current); counter.textContent=`${list.length} concepto${list.length===1?'':'s'}`; deck.innerHTML=list.map((c,i)=>`<article class="card" tabindex="0" role="button" aria-label="Voltear tarjeta: ${c[1]}"><div class="card-inner"><div class="face"><span class="tag">${c[0]}</span><h2 class="term">${c[1]}</h2><div class="english">${c[2]}</div><p class="hint">Haz clic para ver la explicación y ejemplos →</p></div><div class="face back"><h3>Español</h3><p>${c[3]}</p><div class="example"><strong>Ejemplo:</strong> ${c[5]}</div><h3 style="margin-top:15px">English</h3><p class="en">${c[4]}</p><div class="example en"><strong>Example:</strong> ${c[6]}</div></div></div></article>`).join(''); document.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',()=>el.classList.toggle('is-flipped'));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.classList.toggle('is-flipped')}})}); }
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{current=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));render()}); render();
  </script>
</body>
</html>
